databases:
  - name: smartops-database
    plan: starter
    databaseName: smartops
    user: smartops_user

services:
  # Backend Web Service
  - type: web
    name: smartops-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate
    preDeployCommand: cd backend && npx prisma migrate deploy
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartops-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001

  # Frontend Static Site
  - type: web
    name: smartops-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smartops-backend
          property: host
