databases:
  - name: smartops-db
    databaseName: smartops
    plan: free

services:
  - type: web
    name: smartops-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true 
      - key: OPENAI_API_KEY
        sync: false 

  - type: web              # Leave this as 'web'
    name: smartops-frontend
    runtime: static        # This is the magic line that tells Render it's a static site
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist # <--- THIS IS THE KEY: staticPublishPath (case sensitive)
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smartops-backend
          property: host