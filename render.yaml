databases:
  - name: smartops-db
    databaseName: smartops
    plan: free           # Ensures the database is on the free tier

services:
  - type: web
    name: smartops-backend
    runtime: node
    plan: free           # Ensures the backend service is on the free tier
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true 
      - key: OPENAI_API_KEY
        sync: false 

  - type: web
    name: smartops-frontend
    runtime: static      # Classifies this as a static site
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist # The specific key for static sites in a Blueprint
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smartops-backend
          property: host