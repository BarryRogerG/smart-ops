databases:
  - name: smartops-db
    databaseName: smartops
    plan: free

services:
  - type: web
    name: smartops-backend
    runtime: node           # <--- Node for the backend server
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true 
      - key: OPENAI_API_KEY
        sync: false 

  - type: web
    name: smartops-frontend
    runtime: static         # <--- Static for the React/Vite frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist       # This is now valid because runtime is static
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smartops-backend
          property: host