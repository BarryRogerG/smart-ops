databases:
  - name: smartops-db
    databaseName: smartops
    plan: free

services:
  - type: web
    name: smartops-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # This creates a random secret for you automatically
      - key: OPENAI_API_KEY
        sync: false # You will add your key manually in the dashboard

  - type: web
    name: smartops-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist # Vite builds into 'dist' by default
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smartops-backend
          property: host