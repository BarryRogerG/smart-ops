databases:
  - name: smartops-db
    databaseName: smartops
    plan: free

services:
  - type: static
    name: smartops-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true 
      - key: OPENAI_API_KEY
        sync: false 

  - type: web
    name: smartops-frontend
   
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist # Explicitly use 'dist' for Vite
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smartops-backend
          property: host 